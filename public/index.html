<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>London Underground Timings</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="map"></div>
    <div class="app-overlay">
        <header class="header">
            <h1>London Underground Timings</h1>
            <p>Select a station on the map or list below</p>
        </header>

        <main class="main-content">
            <div class="search-panel glass-panel">
                <label for="station-select">Starting Station</label>
                <div class="select-wrapper">
                    <select id="station-select" disabled>
                        <option value="">Loading stations...</option>
                    </select>
                </div>
                <button id="calculate-btn" disabled>Calculate Timings</button>
            </div>

            <div class="results-panel glass-panel hidden" id="results-panel">
                <div class="results-header">
                    <h2>Travel Times from <span id="start-station-name" class="accent-text">-</span></h2>
                    <div class="stats">
                        <span id="total-stations">0 stations</span>
                    </div>
                </div>
                <div class="timings-list" id="timings-list">
                    <!-- Results will be injected here -->
                </div>
            </div>
            
            <div class="loading-overlay hidden" id="loading-overlay">
                <div class="spinner"></div>
                <p>Calculating routes...</p>
            </div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="app.js"></script>
</body>
</html>
